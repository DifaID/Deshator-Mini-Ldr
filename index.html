<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini LDR Studio - 100% Realtime TURN Fixed</title>
  
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{ margin:0; background:#080808; color:#fff; font-family:Arial,sans-serif; text-align:center }
    main{ max-width:900px; margin:auto; padding:10px }
    h1{ font-size:22px; margin:7px 0 }
    p{ color:#bbb; margin:5px }
    button,input{ border:0; border-radius:9px; padding:11px 13px; font-size:14px }
    button{ background:#e53935; color:#fff; font-weight:bold; margin:4px; cursor:pointer }
    button:active{ transform:scale(.96) }
    input{ text-align:center; background:#222; color:#fff; border:1px solid #444 }
    #kodeInput{ width:140px; text-transform:uppercase }
    #status{ margin:9px; color:#79ff79; font-size:13px }
    #roomInfo{ margin:8px; font-size:16px }
    .hidden{ display:none!important }

    /* ========================= KAMERA DISPLAY ========================= */
    .cameras{ display:grid; grid-template-columns:1fr 1fr; gap:5px }
    .camera{ position:relative; width:100%; aspect-ratio:3/4; background:#111; overflow:hidden; border-radius:10px; cursor:pointer }
    
    .camera video{ 
      position:absolute; inset:0; width:100%; height:100%; 
      object-fit: cover; 
      transform: scaleX(-1); 
      background: #000;
      pointer-events: auto;
    }

    .label{ position:absolute; top:7px; left:7px; z-index:5; background:#000b; padding:5px 8px; border-radius:6px; font-size:11px; pointer-events:none }

    /* ========================= KONTROL ========================= */
    .controls{ margin-top:8px }
    #fotoBtn{ font-size:16px; padding:13px 22px }
    #copyRoom{ background:#333 }

    /* ========================= NOTIFIKASI GUEST ========================= */
    #toastNotification {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #16a34a; color: #fff; padding: 12px 24px; border-radius: 30px;
      font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 1000; transition: all 0.3s ease;
    }

    /* ========================= EFEK ========================= */
    .effects{ display:flex; gap:5px; overflow-x:auto; padding:8px 2px; margin-top:5px }
    .effects button{ white-space:nowrap; background:#252525; font-size:12px }
    .effects button.active{ background:#e53935 }
    #effectName{ font-size:12px; color:#aaa }

    /* ========================= AI PROMPT ========================= */
    .ai{ background:#151515; border-radius:10px; padding:10px; margin-top:10px; text-align:left }
    .ai h3{ margin:2px 0 7px; font-size:15px }
    #aiPrompt{ width:100%; text-align:left; outline:none }
    #aiPrompt::placeholder{ color:#777 }
    #aiPreview{ margin-top:7px; color:#aaa; font-size:12px; line-height:1.4 }

    /* ========================= GALERI FOTO ========================= */
    #galleryArea{ margin-top:20px; text-align:left }
    .galleryTitle{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px }
    .galleryTitle h2{ font-size:17px; margin:0 }
    #photoCount{ font-size:12px; color:#aaa }
    .gallery{ display:flex; flex-direction:column; gap:12px }
    .photoCard{ background:#151515; border-radius:12px; padding:10px; border:1px solid #292929; text-align:center }
    .photoCard img{ display:block; width:100%; max-width:280px; margin:auto; border-radius:7px; border:2px solid #333 }
    .photoActions{ display:flex; justify-content:center; gap:5px; margin-top:10px; flex-wrap:wrap }
    .downloadBtn{ background:#2563eb }
    .printBtn{ background:#16a34a }
    .emptyGallery{ background:#111; border:1px dashed #444; border-radius:10px; padding:20px; color:#777; font-size:13px; text-align:center }

    /* ========================= COUNTDOWN ========================= */
    #countdown{ position:fixed; inset:0; background:#000c; z-index:999; display:flex; align-items:center; justify-content:center; font-size:100px; font-weight:bold }

    /* ========================= FILTER COLOR ========================= */
    .fx-normal{filter:none}
    .fx-vivid{filter:saturate(1.5) contrast(1.08)}
    .fx-warm{filter:sepia(.22) saturate(1.35) brightness(1.04)}
    .fx-cool{filter:saturate(.9) hue-rotate(12deg) brightness(1.04)}
    .fx-cinema{filter:contrast(1.25) saturate(.8) brightness(.9)}
    .fx-vintage{filter:sepia(.45) contrast(1.05) saturate(.75)}
    .fx-bw{filter:grayscale(1) contrast(1.15)}

    /* ========================= PRINT STRIP ========================= */
    #printSheet { display: none; }
    @media print{
      body{ background:#fff; color:#000 }
      body > *{ display:none!important }
      #printSheet{ display:flex!important; justify-content:center; align-items:flex-start; width:100%; padding:5mm; }
      .printStripPhoto{ display:block; width:100%; max-width:80mm; height:auto; }
      @page{ size:A4 portrait; margin:10mm }
    }
  </style>
</head>
<body>

<main>
  <h1>📸 Mini LDR Studio</h1>
  <p>Studio foto jarak jauh • 100% Realtime Relayed</p>

  <div id="setup">
    <button id="buatBtn">BUAT ROOM (HOST)</button>
    <div style="margin: 10px 0;">
      <input id="kodeInput" maxlength="6" placeholder="KODE ROOM">
      <button id="gabungBtn">GABUNG (GUEST)</button>
    </div>
  </div>

  <div id="roomInfo"></div>
  <button id="copyRoom" class="hidden">📋 SALIN KODE</button>
  <div id="status">Belum terhubung</div>

  <!-- KAMERA DISPLAY -->
  <div id="cameras" class="cameras hidden">
    <div class="camera" onclick="paksaPlayVideo()">
      <div class="label" id="labelLeft">HOST</div>
      <video id="videoLeft" autoplay playsinline muted></video>
    </div>
    <div class="camera" onclick="paksaPlayVideo()">
      <div class="label" id="labelRight">GUEST</div>
      <video id="videoRight" autoplay playsinline muted></video>
    </div>
  </div>

  <div class="controls">
    <button id="fotoBtn" class="hidden">📸 JEPRET FOTO (HOST ONLY)</button>
  </div>

  <!-- COLOR FILTER -->
  <div id="effectArea" class="hidden">
    <div id="effectName">Efek: Normal</div>
    <div class="effects">
      <button data-fx="fx-normal" class="active">Normal</button>
      <button data-fx="fx-vivid">Vivid</button>
      <button data-fx="fx-warm">Warm</button>
      <button data-fx="fx-cool">Cool</button>
      <button data-fx="fx-cinema">Cinema</button>
      <button data-fx="fx-vintage">Vintage</button>
      <button data-fx="fx-bw">B&W</button>
    </div>
  </div>

  <!-- AI PROMPT -->
  <div id="aiArea" class="ai hidden">
    <h3>🤖 Prompt AI Background Text</h3>
    <input id="aiPrompt" placeholder="Contoh: Studio Aestetik Modern, Sunset vibe...">
    <button id="aiBtn" style="margin-top: 6px;">✨ TERAPKAN TEMA AI</button>
    <div id="aiPreview">Prompt belum digunakan.</div>
  </div>

  <!-- GALERI -->
  <div id="galleryArea" class="hidden">
    <div class="galleryTitle">
      <h2>🎞️ Photobooth Strip Hasil</h2>
      <span id="photoCount">0 Pose Ambil</span>
    </div>
    <div id="gallery" class="gallery"></div>
    <br>
    <button id="resetBtn" style="background:#444;">🔄 RESET / AMBIL ULANG</button>
  </div>
</main>

<div id="countdown" class="hidden">3</div>
<div id="toastNotification" class="hidden">📸 Host mengambil foto!</div>
<div id="printSheet"></div>

<script>
/* ================================================== SUPABASE ================================================== */
const SUPABASE_URL = "https://fdiurlgmbhzzoxtcnpmr.supabase.co";
const SUPABASE_KEY = "sb_publishable_RVQ0mdl1PO17U_NanI-bGA_ZpoE4Zii";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================================================== VARIABLE ================================================== */
let role = null; 
let roomCode = null;
let channel = null;
let localStream = null;
let peer = null;
let pendingCandidates = [];
let currentEffect = "fx-normal";
let currentPrompt = "";
let capturing = false;

const MAX_PHOTOS = 4;
let photoFrames = [];

/* ================================================== ELEMENT ================================================== */
const setup = document.getElementById("setup");
const roomInfo = document.getElementById("roomInfo");
const status = document.getElementById("status");
const cameras = document.getElementById("cameras");

const videoLeft = document.getElementById("videoLeft");
const videoRight = document.getElementById("videoRight");
const labelLeft = document.getElementById("labelLeft");
const labelRight = document.getElementById("labelRight");

const fotoBtn = document.getElementById("fotoBtn");
const copyRoom = document.getElementById("copyRoom");
const countdown = document.getElementById("countdown");
const toastNotification = document.getElementById("toastNotification");
const effectArea = document.getElementById("effectArea");
const aiArea = document.getElementById("aiArea");
const effectName = document.getElementById("effectName");
const aiPrompt = document.getElementById("aiPrompt");
const aiPreview = document.getElementById("aiPreview");
const galleryArea = document.getElementById("galleryArea");
const gallery = document.getElementById("gallery");
const photoCount = document.getElementById("photoCount");
const resetBtn = document.getElementById("resetBtn");
const printSheet = document.getElementById("printSheet");

function buatKode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let kode = "";
  for(let i = 0; i < 6; i++) kode += chars[Math.floor(Math.random() * chars.length)];
  return kode;
}

document.getElementById("buatBtn").onclick = async function(){
  role = "host";
  roomCode = buatKode();
  await masukRoom();
};

document.getElementById("gabungBtn").onclick = async function(){
  const kode = document.getElementById("kodeInput").value.trim().toUpperCase();
  if(kode.length !== 6){ alert("Kode room harus 6 karakter."); return; }
  role = "guest";
  roomCode = kode;
  await masukRoom();
};

function paksaPlayVideo(){
  videoLeft.play().catch(e => console.log(e));
  videoRight.play().catch(e => console.log(e));
}

/* ================================================== MASUK ROOM ================================================== */
async function masukRoom(){
  setup.classList.add("hidden");
  roomInfo.innerHTML = "ROOM: <b>" + roomCode + "</b> (" + role.toUpperCase() + ")";
  copyRoom.classList.remove("hidden");
  status.innerText = "Meminta izin kamera...";

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  }catch(error){
    console.error(error);
    status.innerText = "❌ Kamera gagal diakses.";
    alert("Izin kamera depan diperlukan.");
    return;
  }

  // Set Lokal Stream
  if (role === "host") {
    videoLeft.srcObject = localStream;
    labelLeft.innerText = "KAMU (HOST)";
    labelRight.innerText = "PASANGAN (GUEST)";
    fotoBtn.classList.remove("hidden");
  } else {
    videoRight.srcObject = localStream;
    labelLeft.innerText = "PASANGAN (HOST)";
    labelRight.innerText = "KAMU (GUEST)";
    fotoBtn.classList.add("hidden");
  }

  cameras.classList.remove("hidden");
  effectArea.classList.remove("hidden");
  aiArea.classList.remove("hidden");

  buatPeer();

  channel = supabaseClient.channel("mini-ldr-room-" + roomCode, { config: { broadcast: { self: false } } });
  channel.on("broadcast", { event: "signal" }, async (msg) => await prosesSignal(msg.payload));
  
  channel.subscribe(async (state) => {
    if(state === "SUBSCRIBED"){
      status.innerText = "🟢 Terhubung ke Room. Menghubungkan video...";
      setTimeout(() => { kirim({ type: "hello" }); }, 1000);
    }
  });
}

copyRoom.onclick = async () => {
  try { await navigator.clipboard.writeText(roomCode); alert("Kode room:\n" + roomCode); }
  catch(e) { prompt("Salin kode:", roomCode); }
};

/* ================================================== WEBRTC ENGINE (TURN RELAY FIXED) ================================================== */
function buatPeer(){
  peer = new RTCPeerConnection({ 
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" },
      // Open TURN Relay Public untuk menembus firewall seluler Kalimantan-Blora
      {
        urls: [
          "turn:openrelay.metered.ca:80",
          "turn:openrelay.metered.ca:443",
          "turn:openrelay.metered.ca:443?transport=tcp"
        ],
        username: "openrelay",
        credential: "openrelay"
      }
    ],
    iceTransportPolicy: "all"
  });

  localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

  peer.ontrack = event => {
    const targetVideo = (role === "host") ? videoRight : videoLeft;
    if (targetVideo.srcObject !== event.streams[0]) {
      targetVideo.srcObject = event.streams[0];
      targetVideo.onloadedmetadata = () => {
        targetVideo.play().catch(e => console.log("Auto play fix:", e));
      };
      paksaPlayVideo();
    }
  };

  peer.onicecandidate = async event => {
    if(event.candidate) await kirim({ type: "candidate", candidate: event.candidate });
  };

  peer.onconnectionstatechange = () => {
    if(peer.connectionState === "connected") {
      status.innerText = "🟢 PASANGAN TERHUBUNG FULL!";
    } else if(peer.connectionState === "connecting") {
      status.innerText = "🟡 Menghubungkan aliran video...";
    } else if(peer.connectionState === "failed" || peer.connectionState === "disconnected") {
      status.innerText = "🔴 Mengulang koneksi...";
      ulangKoneksi();
    }
  };
}

async function ulangKoneksi() {
  if (role === "host") {
    try {
      const offer = await peer.createOffer({ iceRestart: true });
      await peer.setLocalDescription(offer);
      await kirim({ type: "offer", sdp: peer.localDescription });
    } catch(e) { console.error("Restart ICE Error:", e); }
  }
}

async function kirim(data){
  if(channel) await channel.send({ type: "broadcast", event: "signal", payload: data });
}

async function prosesSignal(data){
  try{
    if(data.type === "hello"){
      if(role === "host"){
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        await kirim({ type: "offer", sdp: peer.localDescription });
      }
    } else if(data.type === "offer" && role === "guest"){
      await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      await kirim({ type: "answer", sdp: peer.localDescription });
      
      while(pendingCandidates.length){
        await peer.addIceCandidate(pendingCandidates.shift());
      }
    } else if(data.type === "answer" && role === "host"){
      await peer.setRemoteDescription(new RTCSessionDescription(data.sdp));
      while(pendingCandidates.length){
        await peer.addIceCandidate(pendingCandidates.shift());
      }
    } else if(data.type === "candidate"){
      const candidate = new RTCIceCandidate(data.candidate);
      if(peer.remoteDescription && peer.remoteDescription.type){
        await peer.addIceCandidate(candidate);
      } else {
        pendingCandidates.push(candidate);
      }
    } else if(data.type === "photo" && !capturing){
      capturing = true;
      tampilkanToast("📸 Host mengambil foto!");
      await ambilFoto();
      capturing = false;
    } else if(data.type === "reset"){
      photoFrames = [];
      renderPhotoboothStrip();
    }
  }catch(e){
    console.error("Signal Error:", e);
  }
}

function tampilkanToast(pesan){
  toastNotification.innerText = pesan;
  toastNotification.classList.remove("hidden");
  setTimeout(() => toastNotification.classList.add("hidden"), 2500);
}

/* ================================================== AMBIL FOTO ================================================== */
fotoBtn.onclick = async function(){
  if(role !== "host") return;
  if(photoFrames.length >= MAX_PHOTOS){
    alert("📸 Photobooth sudah penuh! Klik Reset untuk mengulang.");
    return;
  }
  if(capturing) return;
  capturing = true;
  await kirim({ type: "photo" });
  await ambilFoto();
  capturing = false;
};

async function ambilFoto(){
  countdown.classList.remove("hidden");
  for(let i = 3; i >= 1; i--){ countdown.innerText = i; await tunggu(700); }
  countdown.innerText = "📸";
  await tunggu(300);
  countdown.classList.add("hidden");
  simpanFrame();
}

function tunggu(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ================================================== EFEK ================================================== */
document.querySelectorAll(".effects button").forEach(btn => {
  btn.onclick = () => {
    currentEffect = btn.dataset.fx;
    videoLeft.className = currentEffect;
    videoRight.className = currentEffect;
    document.querySelectorAll(".effects button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    effectName.innerText = "Efek: " + btn.innerText;
  };
});

document.getElementById("aiBtn").onclick = function(){
  currentPrompt = aiPrompt.value.trim();
  aiPreview.innerHTML = currentPrompt ? "🤖 Konsep AI: <b>" + escapeHTML(currentPrompt) + "</b>" : "Prompt belum digunakan.";
};

function escapeHTML(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================================================== DRAWING CANVAS ================================================== */
function drawCoverImage(ctx, img, x, y, w, h) {
  const imgW = img.videoWidth || img.width;
  const imgH = img.videoHeight || img.height;
  if (!imgW || !imgH) return;

  const imgRatio = imgW / imgH;
  const targetRatio = w / h;
  let sW, sH, sX, sY;

  if (imgRatio > targetRatio) {
    sH = imgH;
    sW = imgH * targetRatio;
    sX = (imgW - sW) / 2;
    sY = 0;
  } else {
    sW = imgW;
    sH = imgW / targetRatio;
    sX = 0;
    sY = (imgH - sH) / 2;
  }

  ctx.save();
  ctx.translate(x + w, y);
  ctx.scale(-1, 1);
  ctx.drawImage(img, sX, sY, sW, sH, 0, 0, w, h);
  ctx.restore();
}

/* ================================================== SIMPAN FRAME ================================================== */
function simpanFrame(){
  const W = 800, H = 450;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const photoW = W / 2, photoH = H;

  ctx.filter = getComputedStyle(videoLeft).filter;

  drawCoverImage(ctx, videoLeft, 0, 0, photoW, photoH);
  drawCoverImage(ctx, videoRight, photoW, 0, photoW, photoH);

  ctx.filter = "none";

  ctx.fillStyle = "#fff"; ctx.fillRect(photoW - 1, 0, 2, photoH);

  photoFrames.push(canvas);
  renderPhotoboothStrip();
}

/* ================================================== RENDER STRIP VERTIKAL ================================================== */
function renderPhotoboothStrip(){
  gallery.innerHTML = "";
  photoCount.innerText = photoFrames.length + " / " + MAX_PHOTOS + " Pose";

  if(photoFrames.length === 0){
    gallery.innerHTML = '<div class="emptyGallery">Belum ada foto.</div>';
    galleryArea.classList.remove("hidden");
    return;
  }

  galleryArea.classList.remove("hidden");

  const padding = 30, frameGap = 20, frameW = 800, frameH = 450, footerH = 140;
  const stripW = frameW + (padding * 2);
  const stripH = (frameH * photoFrames.length) + (frameGap * (photoFrames.length - 1)) + (padding * 2) + footerH;

  const stripCanvas = document.createElement("canvas");
  stripCanvas.width = stripW; stripCanvas.height = stripH;
  const ctx = stripCanvas.getContext("2d");

  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, stripW, stripH);

  photoFrames.forEach((frame, idx) => {
    const startY = padding + (idx * (frameH + frameGap));
    ctx.drawImage(frame, padding, startY, frameW, frameH);
  });

  const footerY = stripH - footerH + 20;
  ctx.fillStyle = "#111111"; ctx.font = "bold 32px Arial"; ctx.textAlign = "center";
  ctx.fillText("MINI LDR STUDIO", stripW / 2, footerY + 30);

  ctx.fillStyle = "#666666"; ctx.font = "18px Arial";
  const today = new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'short', year: 'numeric' });
  ctx.fillText(today + " • Room: " + roomCode, stripW / 2, footerY + 65);

  if(currentPrompt){
    ctx.fillStyle = "#e53935"; ctx.font = "italic 16px Arial";
    ctx.fillText("AI Theme: " + currentPrompt.slice(0, 45), stripW / 2, footerY + 95);
  }

  const stripDataURL = stripCanvas.toDataURL("image/jpeg", 0.95);

  const card = document.createElement("div");
  card.className = "photoCard";
  const img = document.createElement("img");
  img.src = stripDataURL;

  const actions = document.createElement("div");
  actions.className = "photoActions";

  const downloadBtn = document.createElement("button");
  downloadBtn.className = "downloadBtn"; downloadBtn.innerText = "💾 DOWNLOAD STRIP PHOTOBOOTH";
  downloadBtn.onclick = () => {
    const a = document.createElement("a"); a.href = stripDataURL; a.download = `Photobooth_LDR_${roomCode}.jpg`;
    a.click();
  };

  const printBtn = document.createElement("button");
  printBtn.className = "printBtn"; printBtn.innerText = "🖨️ CETAK STRIP";
  printBtn.onclick = () => {
    printSheet.innerHTML = `<img class="printStripPhoto" src="${stripDataURL}">`;
    window.print();
  };

  actions.appendChild(downloadBtn); actions.appendChild(printBtn);
  card.appendChild(img); card.appendChild(actions);
  gallery.appendChild(card);
}

resetBtn.onclick = async () => {
  if(photoFrames.length > 0 && confirm("Hapus semua pose?")){
    photoFrames = [];
    renderPhotoboothStrip();
    await kirim({ type: "reset" });
  }
};
</script>

</body>
</html>
